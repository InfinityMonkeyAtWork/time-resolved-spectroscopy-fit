# use these models to describe the energy-dependent data
# (available functions info: /src/trspecfit/functions/energy.py)

# ground state (most parameters should be able to vary)
base:
    LinBack:
      m: [1E-2, True, -1, 1]
      b: [0, True, -5, 5]
      xStart: [0, False]
      xStop: [20, False]
    GLP:
      A: [12, True, 5, 15]
      x0: [8, True, 5, 15]
      F: [1.5, True, 0.75, 2.5]
      m: [0.3, True, 0, 1]

# 2D model: every line-shape parameter is "static" (not fitted, set from the
# baseline fit); the "project" / "file" levels live in models_time.yaml
2D:
    LinBack:
      m: [1E-2, static]
      b: [0, static]
      xStart: [0, False]
      xStop: [20, False]
    GLP:
      A: [12, static]
      x0: [8, static]
      F: [1.5, static]
      m: [0.3, static]
